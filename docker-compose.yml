services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paypulse
      POSTGRES_USER: paypulse
      POSTGRES_PASSWORD: paypulse
    ports:
      - "5432:5432"
    volumes:
      - paypulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paypulse -d paypulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paypulse-postgres:
